interface:
  display_name: "Bilibili Render PDF"
  short_description: "Turn a Bilibili lecture into a structured LaTeX/PDF note set."
  default_prompt: "Use this skill as a harness-managed lecture note pipeline, not as a one-shot writing prompt. Run the stages source acquisition -> planner -> coverage extractor -> writer -> figure agent -> evaluator -> repair writer -> final validator. When CC subtitles are unavailable, use a device-aware ASR backend: default to Qwen3-ASR-1.7B plus Qwen3-ForcedAligner-0.6B on CUDA machines, and default to a Whisper backend on Apple Silicon Macs. Normalize ASR output into SRT or timestamped segments before downstream use. Emit `lecture_plan.json`, segment contracts under `contracts/`, `figure_plan.json`, `eval_reports/pass_##.json`, and `repair_log.jsonl`. For long videos, 分P workloads, or course-mode jobs, proactively recommend that the user explicitly request parallel subagents so `spawn_agent` can be used; once permission exists, prefer bounded coverage agents, a figure agent, and a repair loop instead of one monolithic writing pass."
