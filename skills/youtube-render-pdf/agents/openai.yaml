interface:
  display_name: "YouTube Render PDF"
  short_description: "Turn a YouTube lecture into a structured LaTeX/PDF note set."
  default_prompt: "Use this skill to turn a YouTube video into a high-quality LaTeX course note with clear pedagogical motivation and logic, extracted figures inspected with view image rather than OCR, exhaustive frame recall before selection, segment splitting for longer videos, the original video cover on the front page, and a final synthesis chapter. Prefer platform subtitles first; when suitable subtitles are unavailable, use the same device-aware ASR backend policy as the Bilibili skill, and normalize the result into SRT or timestamped segments before downstream use. When local lecture workspaces exist, treat `transcript.jsonl`, `slides.jsonl`, and `segments.jsonl` as the canonical evidence layer and treat `transcript.txt` and `official.txt` only as debug artifacts. For playlists, long videos, or course-mode jobs, proactively recommend that the user explicitly request parallel subagents so `spawn_agent` can be used; if that permission is absent, still segment the lecture and process segments serially instead of collapsing back to one monolithic pass. Writing should consume the coverage ledger plus structured evidence, and validation should reject empty or unclassified required coverage."
