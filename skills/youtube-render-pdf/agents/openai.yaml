interface:
  display_name: "YouTube Render PDF"
  short_description: "Turn a YouTube lecture into a structured LaTeX/PDF note set."
  default_prompt: "Use this skill as a harness-managed lecture note pipeline, not as a one-shot writing prompt. Run the stages source acquisition -> planner -> coverage extractor -> writer -> figure agent -> evaluator -> repair writer -> final validator. Prefer platform subtitles first; when suitable subtitles are unavailable, use the same device-aware ASR backend policy as the Bilibili skill, and normalize the result into SRT or timestamped segments before downstream use. When local lecture workspaces exist, treat `transcript.jsonl`, `slides.jsonl`, and `segments.jsonl` as the canonical evidence layer and treat `transcript.txt` and `official.txt` only as debug artifacts. Emit `lecture_plan.json`, segment contracts under `contracts/`, `figure_plan.json`, `eval_reports/pass_##.json`, and `repair_log.jsonl`. Writing must consume the coverage ledger plus structured evidence. Validation must reject non-passing evaluator reports, empty or unclassified required coverage, missing figure provenance, and delivery that skips the repair loop."
